[project]
name = "jitapi"
version = "0.2.0"
description = "Point Claude at any API. JitAPI figures out which endpoints to call and in what order — automatically."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "api", "openapi", "llm", "orchestration", "claude", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "openapi-pydantic>=0.4.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "fastembed>=0.2.0",
    "networkx>=3.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3.0"]
openai = ["openai>=1.0.0"]
cohere = ["cohere>=5.0.0"]
all = ["voyageai>=0.3.0", "openai>=1.0.0", "cohere>=5.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
jitapi = "jitapi.main:main"

[project.urls]
Homepage = "https://github.com/nk3750/jitapi"
Documentation = "https://github.com/nk3750/jitapi#readme"
Repository = "https://github.com/nk3750/jitapi"
Issues = "https://github.com/nk3750/jitapi/issues"
Changelog = "https://github.com/nk3750/jitapi/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".venv*", "demo/", "IMPROVEMENT_PLAN.md", "INTEGRATION_TEST*", "STRESS_TEST*", "DEMO_SCRIPT.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/jitapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
